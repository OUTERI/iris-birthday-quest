    <text x="365" y="170" font-size="28">魔药课</text>
    <text x="365" y="204" font-size="17" font-weight="400">上中卧室</text>
    <text x="536" y="192" font-size="17">密室</text>
    <text x="715" y="180" font-size="28">厨房</text>
    <text x="195" y="420" font-size="27">分院厅</text>
    <text x="195" y="453" font-size="17" font-weight="400">左下卧室</text>

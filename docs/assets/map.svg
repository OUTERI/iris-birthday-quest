<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Iris 的活点地图</title>
  <desc id="desc">上排是卫生间、魔药课卧室、窄卫生间和厨房；下排是分院卧室、九又四分之三站台卧室、客厅；最下方连接阳台。</desc>

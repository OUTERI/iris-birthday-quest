    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M2 4h1m8 3h1M5 13h1" stroke="#9e7950" opacity=".22"/></pattern>
  </defs>
  <rect x="20" y="20" width="860" height="560" rx="5" fill="url(#paper)" stroke="#7d573a" stroke-width="5"/>
  <rect x="37" y="37" width="826" height="526" fill="url(#grain)" stroke="#b69561" stroke-width="2"/>
  <g fill="#f7e8c5" stroke="#805b41" stroke-width="5" stroke-linejoin="round">
    <path d="M80 115h160v150H80z"/>
    <path d="M250 82h230v188H250z"/>
    <path d="M490 120h93v145h-93z"/>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#211b22">
  <meta name="description" content="Iris 的霍格沃茨生日特别任务">
  <title>Iris · 霍格沃茨生日特别任务</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./style.css?v=6">
  <script src="./app.js?v=6" defer></script>
</head>
<body>
  <div class="sky" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="site-frame">
    <header class="site-header">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>IRIS <small>· THE BIRTHDAY QUEST</small></span></div>
      <span class="header-date">02 OCTOBER</span>
    </header>
    <main id="app" class="app" aria-live="polite"></main>
    <footer class="site-footer">
      <span>Made for Iris, with a little magic.</span>
      <button id="reset-button" class="quiet-button" type="button">重新开始</button>
    </footer>
  </div>
  <dialog id="reset-dialog" class="reset-dialog">
    <form method="dialog">
      <h2>重新开始旅程？</h2>
      <p>这会清除这台手机保存的进度，回到入学通知书。</p>
      <div class="dialog-actions">
        <button value="cancel" class="button button-ghost">继续旅程</button>
        <button value="confirm" class="button button-primary">重新开始</button>
      </div>
    </form>
  </dialog>
  <div id="spell-overlay" class="spell-overlay" role="status" aria-live="polite" hidden>
    <span class="spell-overlay__halo" aria-hidden="true"></span>
    <svg class="spell-overlay__wand" viewBox="0 0 260 260" fill="none" aria-hidden="true"><path d="M43 219 174 86" stroke="#3b2530" stroke-width="17" stroke-linecap="round"/><path d="M55 207 174 86" stroke="#bf8755" stroke-width="6" stroke-linecap="round"/><path d="m164 95 27-28" stroke="#f5d78e" stroke-width="4" stroke-linecap="round"/><path d="m194 48 4 14 14 4-14 4-4 14-4-14-14-4 14-4 4-14Z" fill="#ffe7ac"/><circle cx="194" cy="66" r="26" stroke="#e6bc73" stroke-opacity=".6"/></svg>
    <span class="spell-overlay__spark spell-overlay__spark--a" aria-hidden="true">✦</span><span class="spell-overlay__spark spell-overlay__spark--b" aria-hidden="true">✧</span><span class="spell-overlay__spark spell-overlay__spark--c" aria-hidden="true">✦</span>
    <strong class="spell-overlay__message"></strong>
  </div>
</body>
</html>
